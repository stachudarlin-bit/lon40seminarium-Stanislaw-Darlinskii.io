<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator kodu paskowego rezystora</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Kalkulator kodu paskowego rezystora</h1>
    <p class="hint">Kliknij pasek na rezystorze i wybierz jego kolor.</p>

    <section class="illustration-wrap" aria-label="Ilustracja rezystora">
      <svg class="resistor-svg" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" aria-label="Rezystor z czterema paskami">
        <defs>
          <linearGradient id="leadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d7dde6"/>
            <stop offset="45%" stop-color="#9ca8b8"/>
            <stop offset="100%" stop-color="#7d899a"/>
          </linearGradient>

          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#b97f44"/>
            <stop offset="22%" stop-color="#f1c88f"/>
            <stop offset="48%" stop-color="#f8dab0"/>
            <stop offset="74%" stop-color="#edbc7b"/>
            <stop offset="100%" stop-color="#a56a35"/>
          </linearGradient>

          <linearGradient id="bandEmpty" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3f4f6"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
          </linearGradient>
        </defs>

        <rect x="20" y="123" width="240" height="14" rx="7" fill="url(#leadGrad)"/>
        <rect x="640" y="123" width="240" height="14" rx="7" fill="url(#leadGrad)"/>

        <rect x="230" y="58" width="440" height="144" rx="72" fill="url(#bodyGrad)" stroke="#86562b" stroke-width="4"/>
        <ellipse cx="280" cy="130" rx="42" ry="66" fill="rgba(255,255,255,0.16)"/>
        <ellipse cx="620" cy="130" rx="40" ry="66" fill="rgba(0,0,0,0.14)"/>
        <rect x="230" y="58" width="440" height="144" rx="72" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

        <rect id="stripe1" class="band" x="332" y="62" width="24" height="136" rx="4" fill="url(#bandEmpty)" role="button" tabindex="0"/>
        <rect id="stripe2" class="band" x="392" y="62" width="24" height="136" rx="4" fill="url(#bandEmpty)" role="button" tabindex="0"/>
        <rect id="stripe3" class="band" x="468" y="62" width="24" height="136" rx="4" fill="url(#bandEmpty)" role="button" tabindex="0"/>
        <rect id="stripe4" class="band tolerance" x="564" y="62" width="18" height="136" rx="4" fill="url(#bandEmpty)" role="button" tabindex="0"/>
      </svg>

      <div id="palette" class="palette" hidden>
        <p id="paletteTitle" class="palette-title"></p>
        <div id="paletteOptions" class="palette-options"></div>
        <button id="closePalette" class="close-palette" type="button">Zamknij</button>
      </div>
    </section>

    <p id="result" class="result">Rezystancja: wybierz kolory wszystkich pasków.</p>
  </main>
</body>
</html>
